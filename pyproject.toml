[project]
name = "specrag"
version = "0.1.0"
description = "RAG and evaluation over technical specifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "tiktoken>=0.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "sentence-transformers>=3",
    "torch>=2.2",
]

[project.scripts]
specrag = "specrag.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: needs fetched corpus",
    "model: needs the dense model",
    "reranker: needs the reranker model",
    "real_preflight: runs the real corpus pre-flight (no stub)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
